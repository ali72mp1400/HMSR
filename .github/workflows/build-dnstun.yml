
name: Build DNSTun v0.3 Diagnostics APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q DNSTun-v0.3-soar-diagnostics.zip -d extracted
          test -f extracted/DNSTun/settings.gradle.kts
          test -f extracted/DNSTun/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: extracted/DNSTun
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DNSTun-v0.3-Diagnostics-APK
          path: extracted/DNSTun/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
