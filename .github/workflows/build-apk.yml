
name: Build RSMH Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -q RSMH-v1.1.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build libbox.aar
        run: |
          git clone https://github.com/SagerNet/sing-box.git
          cd sing-box
          TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          git checkout "$TAG"
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile bind -v -androidapi 23 -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false -target=android/arm64 -tags "with_gvisor,with_quic,with_utls,with_clash_api,with_wireguard,badlinkname,tfogo_checklinkname0" -ldflags "-X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" -o libbox.aar ./experimental/libbox
          mkdir -p ../extracted/RSMH/app/libs
          cp libbox.aar ../extracted/RSMH/app/libs/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: extracted/RSMH
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RSMH-Android-APK
          path: extracted/RSMH/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
